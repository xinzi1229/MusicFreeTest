name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            echo "Using pre-installed Android SDK at $ANDROID_HOME"
          else
            echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            curl -sfLo cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            echo "PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_ENV"
          fi

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Build release APK (arm64)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MusicFreeTest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicFreeTest.apk
          path: MusicFreeTest.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: MusicFreeTest.apk

      - name: Create/replace release
        run: |
          gh release delete apk-latest --cleanup-tag 2>/dev/null || true
          gh release create apk-latest MusicFreeTest.apk \
            --title "MusicFreeTest APK (latest)" \
            --prerelease \
            --notes "Auto-built by GitHub Actions. Download the APK and install on an Android device (allow installing apps from unknown sources)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
